<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPS Logger</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #121212; color: #fff; }
    button { padding: 12px 24px; margin: 10px 0; font-size: 16px; border: none; border-radius: 4px; }
    .stop { background: #dc3545; color: white; }
    .start { background: #28a745; color: white; }
    pre { background: #1e1e1e; padding: 15px; border-radius: 5px; overflow-x: auto; color: #00ff00; }
    .warning { color: #ff9800; font-weight: bold; }
  </style>
</head>
<body>
  <h2>📍 Remote GPS Logger</h2>
  <p class="warning">WARNING: Ensure your PC server is running and firewall allows port 8000.</p>
  <p>Target PC IP: <span id="targetDisplay">Not Set</span></p>

  <label>
    Interval (seconds): 
    <input type="number" id="intervalInput" value="5" min="1" max="3600" style="color:black">
  </label>
  
  <button id="startBtn" class="start" onclick="startTracking()">Start Tracking</button>
  <button id="stopBtn" class="stop" onclick="stopTracking()" disabled>Stop Tracking</button>

  <p id="status">Ready</p>
  <p>Locations logged: <span id="count">0</span></p>
  
  <h3>Latest Attempt:</h3>
  <pre id="output">No data yet</pre>

  <script>
    // ---------------------------------------------------------
    // CONFIGURATION
    // REPLACE THIS WITH YOUR PC'S LOCAL IP ADDRESS
    const TARGET_IP = "172.20.10.7"; 
    const TARGET_PORT = "8000";
    // ---------------------------------------------------------

    document.getElementById("targetDisplay").textContent = `${TARGET_IP}:${TARGET_PORT}`;

    let trackingTimer = null;
    let locationCount = 0;
    let isTracking = false;

    function startTracking() {
      if (!navigator.geolocation) {
        alert("Geolocation not supported.");
        return;
      }

      const intervalSeconds = parseInt(document.getElementById("intervalInput").value) || 5;
      const intervalMs = intervalSeconds * 1000;

      document.getElementById("startBtn").disabled = true;
      document.getElementById("stopBtn").disabled = false;
      document.getElementById("status").textContent = `Tracking started...`;
      isTracking = false; // Reset flag

      startLoop(intervalMs);
    }

    function startLoop(intervalMs) {
      if (!isTracking) {
        isTracking = true;
        getLocationLoop(intervalMs);
      }
    }

    function getLocationLoop(intervalMs) {
      if (!isTracking) return;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          if (!isTracking) return;

          const { latitude, longitude, accuracy } = position.coords;
          const timestamp = new Date().toISOString();
          locationCount++;

          document.getElementById("status").textContent = `Tracking active`;
          document.getElementById("count").textContent = locationCount;

          const latestOutput = 
            `Time: ${timestamp}\n` +
            `Lat: ${latitude}\n` +
            `Lon: ${longitude}\n` +
            `Acc: ${accuracy}m\n` +
            `Status: Sending to ${TARGET_IP}...`;

          document.getElementById("output").textContent = latestOutput;

          // SEND TO LOCAL PC
          const url = `http://${TARGET_IP}:${TARGET_PORT}/log?lat=${latitude}&lon=${longitude}&accuracy=${accuracy}`;
          
          fetch(url, {
            method: 'GET',
            mode: 'no-cors' // Critical: Prevents CORS errors, but makes response opaque
          })
          .then(() => {
            // Even with no-cors, if it reaches here, the request was sent
            console.log("Data sent successfully (or blocked by CORS, but sent)");
          })
          .catch(err => {
            console.error("Failed to send:", err);
            document.getElementById("output").textContent += "\nERROR: Could not connect to PC. Check IP/Firewall.";
          });

          // Schedule next
          if (isTracking) {
            trackingTimer = setTimeout(() => getLocationLoop(intervalMs), intervalMs);
          }
        },
        (error) => {
          document.getElementById("status").textContent = `Error: ${error.message}`;
          console.error(error);
          if (isTracking) {
            trackingTimer = setTimeout(() => getLocationLoop(intervalMs), intervalMs);
          }
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function stopTracking() {
      isTracking = false;
      if (trackingTimer !== null) {
        clearTimeout(trackingTimer);
        trackingTimer = null;
      }
      document.getElementById("startBtn").disabled = false;
      document.getElementById("stopBtn").disabled = true;
      document.getElementById("status").textContent = "Tracking stopped";
    }

    window.addEventListener("beforeunload", () => {
      stopTracking();
    });
  </script>
</body>
</html>
